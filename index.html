<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPB 支配下・全メンバー名鑑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .giants { border-left: 6px solid #ff6600; }
        .hawks { border-left: 6px solid #f6ca06; }
        /* スクロール可能なテーブル用の設定 */
        .wiki-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; background: #222; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; color: #ddd; }
        th, td { border: 1px solid #444; padding: 6px 4px; text-align: center; white-space: nowrap; }
        th { background: #333; font-weight: bold; }
    </style>
</head>
<body class="bg-black text-white font-sans">

    <div id="list-page">
        <header class="p-4 bg-zinc-900 sticky top-0 z-50 border-b border-zinc-800 shadow-2xl">
            <h1 class="text-lg font-black italic text-center tracking-tighter">NPB COMPLETE DIRECTORY</h1>
            <div class="flex overflow-x-auto gap-2 mt-4 no-scrollbar pb-1">
                <button onclick="changeTeam('読売ジャイアンツ', 'giants')" class="flex-none px-4 py-2 bg-[#ff6600] text-black rounded font-bold text-xs">巨人</button>
                <button onclick="changeTeam('福岡ソフトバンクホークス', 'hawks')" class="flex-none px-4 py-2 bg-[#f6ca06] text-black rounded font-bold text-xs">SB</button>
                <button onclick="changeTeam('阪神タイガース', 'tigers')" class="flex-none px-4 py-2 bg-[#ffe200] text-black rounded font-bold text-xs">阪神</button>
                <button onclick="changeTeam('広島東洋カープ', 'carp')" class="flex-none px-4 py-2 bg-[#ff0000] text-white rounded font-bold text-xs">広島</button>
                <button onclick="changeTeam('横浜DeNAベイスターズ', 'baystars')" class="flex-none px-4 py-2 bg-[#005596] text-white rounded font-bold text-xs">横浜</button>
                <button onclick="changeTeam('中日ドラゴンズ', 'dragons')" class="flex-none px-4 py-2 bg-[#002a86] text-white rounded font-bold text-xs">中日</button>
                <button onclick="changeTeam('東京ヤクルトスワローズ', 'swallows')" class="flex-none px-4 py-2 bg-[#004631] text-white rounded font-bold text-xs">ヤクルト</button>
                <button onclick="changeTeam('オリックス・バファローズ', 'buffaloes')" class="flex-none px-4 py-2 bg-[#b19962] text-black rounded font-bold text-xs">オリックス</button>
                <button onclick="changeTeam('千葉ロッテマリーンズ', 'marines')" class="flex-none px-4 py-2 bg-[#221815] text-white rounded font-bold text-xs">ロッテ</button>
                <button onclick="changeTeam('北海道日本ハムファイターズ', 'fighters')" class="flex-none px-4 py-2 bg-[#006298] text-white rounded font-bold text-xs">日ハム</button>
                <button onclick="changeTeam('東北楽天ゴールデンイーグルス', 'eagles')" class="flex-none px-4 py-2 bg-[#870011] text-white rounded font-bold text-xs">楽天</button>
                <button onclick="changeTeam('埼玉西武ライオンズ', 'lions')" class="flex-none px-4 py-2 bg-[#003567] text-white rounded font-bold text-xs">西武</button>
            </div>
        </header>

        <main class="p-4">
            <h2 id="current-team-name" class="text-sm font-bold text-zinc-500 mb-4 tracking-widest uppercase text-center">TEAM SELECT</h2>
            <div id="player-grid" class="grid grid-cols-1 gap-2"></div>
        </main>
    </div>

    <div id="detail-page" class="hidden min-h-screen bg-zinc-950 p-6 flex flex-col">
        <button onclick="backToList()" class="mb-4 text-zinc-400 font-bold flex items-center gap-2">
            <span class="text-2xl">←</span> 戻る
        </button>
        <div class="max-w-2xl mx-auto w-full pb-20">
            <h2 id="d-name" class="text-4xl font-black mb-1 italic tracking-tighter"></h2>
            <div class="h-1 w-20 bg-yellow-500 mb-6"></div>
            
            <div class="mb-8">
                <h3 class="text-xs font-bold text-zinc-500 mb-2 tracking-widest uppercase">Overview</h3>
                <div id="d-wiki" class="text-sm leading-relaxed text-zinc-300 bg-white/5 p-4 rounded-2xl">取得中...</div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-zinc-500 mb-2 tracking-widest uppercase">Stats (成績表)</h3>
                <div id="d-table" class="wiki-table-wrapper">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // チーム選択
        async function changeTeam(teamFullName, cssClass) {
            const grid = document.getElementById('player-grid');
            document.getElementById('current-team-name').innerText = teamFullName;
            grid.innerHTML = '<p class="text-center py-10 text-zinc-600 animate-pulse text-sm">メンバー取得中...</p>';

            try {
                const url = `https://ja.wikipedia.org/w/api.php?action=parse&format=json&origin=*&page=${encodeURIComponent(teamFullName + 'の選手一覧')}&prop=links`;
                const res = await fetch(url);
                const data = await res.json();
                grid.innerHTML = '';
                const links = data.parse.links.filter(l => l.exists !== undefined && !l['*'].includes('一覧') && !l['*'].includes('Category') && !l['*'].includes('球団'));
                links.forEach(link => {
                    const name = link['*'];
                    const btn = document.createElement('button');
                    btn.className = `p-4 rounded-xl bg-zinc-900 text-left font-bold text-lg border-l-4 border-zinc-700 ${cssClass}`;
                    btn.innerHTML = `<span>${name}</span>`;
                    btn.onclick = () => showDetail(name);
                    grid.appendChild(btn);
                });
            } catch (e) { grid.innerHTML = 'エラー発生'; }
        }

        // 詳細表示
        async function showDetail(name) {
            document.getElementById('list-page').classList.add('hidden');
            document.getElementById('detail-page').classList.remove('hidden');
            window.scrollTo(0,0);
            document.getElementById('d-name').innerText = name;
            document.getElementById('d-wiki').innerText = "取得中...";
            document.getElementById('d-table').innerHTML = '<p class="p-4 text-xs text-zinc-500 italic text-center">Wikipediaの表を解析中...</p>';

            try {
                // 1. 概要取得
                const resSum = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);
                const dataSum = await resSum.json();
                document.getElementById('d-wiki').innerText = dataSum.extract || "詳細なし";

                // 2. 成績表(Table)取得
                const resTable = await fetch(`https://ja.wikipedia.org/w/api.php?action=parse&format=json&origin=*&page=${encodeURIComponent(name)}&prop=text&section=0`);
                const dataTable = await resTable.json();
                const html = dataTable.parse.text["*"];
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                
                // 「年度別打撃成績」などのテーブルを探す
                const table = doc.querySelector('table.wikitable');
                if (table) {
                    // Wikipediaの相対リンクを無効化（クリックでバグらないように）
                    table.querySelectorAll('a').forEach(a => a.removeAttribute('href'));
                    document.getElementById('d-table').innerHTML = '';
                    document.getElementById('d-table').appendChild(table);
                } else {
                    document.getElementById('d-table').innerHTML = '<p class="p-4 text-xs text-zinc-600">成績表が見つかりませんでした。</p>';
                }
            } catch (e) {
                document.getElementById('d-wiki').innerText = "読み込みエラー";
            }
        }

        function backToList() {
            document.getElementById('list-page').classList.remove('hidden');
            document.getElementById('detail-page').classList.add('hidden');
        }

        changeTeam('読売ジャイアンツ', 'giants');
    </script>
</body>
</html>
